# Clé maîtresse de l'application chiffrée par systemd-creds (SEC-29, systemd >= 250), au lieu du
# fichier en clair /etc/lockmaster/master.key :
#   sudo systemd-creds encrypt --name=master.key /etc/lockmaster/master.key /etc/lockmaster/master.key.cred
#   sudo install -D -m 0644 master-key-credential.conf /etc/systemd/system/lockmaster.service.d/credential.conf
#   sudo systemctl daemon-reload && sudo systemctl restart lockmaster
# puis, après une sauvegarde hors ligne de la clé, supprimer le fichier en clair.
# Les commandes lancées hors du service (lockmaster config check...) ne voient pas cette clé.
# Même principe pour le signataire : lockmaster-signer.service et
# LOCKMASTER_SIGNER__SECURITY__MASTER_KEY_FILE=%d/master.key.
[Service]
LoadCredentialEncrypted=master.key:/etc/lockmaster/master.key.cred
Environment=LOCKMASTER__SECURITY__MASTER_KEY_FILE=%d/master.key
