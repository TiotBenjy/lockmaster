# Comptes système de lockmaster (systemd-sysusers, appelé par le postinstall des paquets).
# lockmaster        : l'application (réseau, base, publication) : n'a JAMAIS accès aux clés de signature
# lockmaster-signer : le service de signature (aucun réseau, seul détenteur des clés) : ADR-0009
# lockmaster-sign   : groupe autorisé à se connecter au socket du signataire
g lockmaster-sign   -
u lockmaster        - "lockmaster - application"            /var/lib/lockmaster        /usr/sbin/nologin
u lockmaster-signer - "lockmaster - service de signature"   /var/lib/lockmaster-signer /usr/sbin/nologin
m lockmaster        lockmaster-sign
m lockmaster-signer lockmaster-sign
