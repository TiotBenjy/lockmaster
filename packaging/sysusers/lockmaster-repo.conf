# Comptes du serveur de dépôt (paquet lockmaster-repo, ADR-0008), créés par systemd-sysusers.
# lockmaster-repo : groupe propriétaire de /srv/lockmaster-repo ; nginx en est membre (lecture seule)
# lockmaster-sync : compte de publication rsync, sans mot de passe, restreint par rrsync dans
#                   authorized_keys. Shell /bin/sh : sshd lance la commande imposée (rrsync) par le
#                   shell du compte, ce que /usr/sbin/nologin refuserait.
g lockmaster-repo -
u lockmaster-sync - "lockmaster - publication rsync" /home/lockmaster-sync /bin/sh
m lockmaster-sync lockmaster-repo
