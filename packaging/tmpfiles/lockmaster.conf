# Dossier du socket de signature : traversable par le groupe lockmaster-sign uniquement (ADR-0009).
# setgid : un socket créé dedans hérite du groupe lockmaster-sign, même depuis un conteneur rootless
# qui ne voit pas ce groupe (mode quadlet).
# Le socket lui-même est créé par lockmaster-signer.socket (0660 lockmaster-signer:lockmaster-sign).
d /run/lockmaster-sign 2750 lockmaster-signer lockmaster-sign -
# Données du signataire (signer.db) : son compte seul. Créé dès l'installation pour que `signer init`
# (lancé avant le service) le trouve, et que la séparation soit vérifiable sans service démarré.
d /var/lib/lockmaster-signer 0700 lockmaster-signer lockmaster-signer -
