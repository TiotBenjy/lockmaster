# Réglages pnpm (pnpm 12 lit sa configuration ici, ADR-0014).
# Chaîne d'approvisionnement (docs/02 A13, SEC-24) :
#  - seuls ces paquets peuvent exécuter un script d'installation ; tout autre script est refusé et
#    fait échouer l'installation (ERR_PNPM_IGNORED_BUILDS). « onlyBuiltDependencies » de pnpm 10 est
#    ignoré sans avertissement depuis pnpm 11 : ne pas le réintroduire ;
#  - une version publiée depuis moins de 7 jours (10 080 minutes) n'est pas installée (strict : une
#    valeur explicite rend minimumReleaseAgeStrict vrai).
allowBuilds:
  better-sqlite3: true
  esbuild: true

minimumReleaseAge: 10080

# Exception au délai de 7 jours, réservée aux correctifs de sécurité : versions EXACTES, avec la
# référence de l'avis et la date à laquelle l'exception devient inutile (à retirer ensuite).
#  - fast-uri 3.1.9 et 4.2.3 (publiées le 2026-10-19) : GHSA-xhq7-xmqj-769h, GHSA-333x-w4r6-6crp
#    et avis associés (alertes Dependabot 1 à 8) ; inutile à partir du 2026-10-26.
minimumReleaseAgeExclude:
  - fast-uri@3.1.9 || 4.2.3

# Versions corrigées imposées aux dépendances transitives (fastify -> ajv, @fastify/ajv-compiler,
# fast-json-stringify) tant que leurs versions ne les exigent pas d'elles-mêmes.
overrides:
  fast-uri@^3: ^3.1.9
  fast-uri@^4: ^4.2.3
