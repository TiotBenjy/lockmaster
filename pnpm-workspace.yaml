# Réglages pnpm (pnpm 12 lit sa configuration ici, ADR-0014).
# Chaîne d'approvisionnement (docs/02 A13, SEC-24) :
#  - seuls ces paquets peuvent exécuter un script d'installation ; tout autre script est refusé et
#    fait échouer l'installation (ERR_PNPM_IGNORED_BUILDS). « onlyBuiltDependencies » de pnpm 10 est
#    ignoré sans avertissement depuis pnpm 11 : ne pas le réintroduire ;
#  - une version publiée depuis moins de 7 jours (10 080 minutes) n'est pas installée ; strict : elle
#    est refusée, jamais ajoutée d'office aux exceptions.
# Liste fermée de réglages : toute nouvelle clé doit passer par le test SEC-24.
allowBuilds:
  better-sqlite3: true
  esbuild: true

minimumReleaseAge: 10080
minimumReleaseAgeStrict: true

# Exception au délai de 7 jours (CONVENTIONS.md §Contenu externe) : avis de CVSS au moins 8,5 ou présent
# dans KEV, décidée par le porteur, proposée par `node scripts/security-exception.mjs`. Chaque entrée de
# `minimumReleaseAgeExclude` (version EXACTE) a ici sa ligne de justification :
#  - <paquet>@<version> : <GHSA, ...> ; CVSS <score> | KEV ; retrait le <AAAA-MM-JJ>
# et se retire à cette date (test/unit/packaging/release-age-exceptions.test.ts). Aucune en cours.

# Versions corrigées imposées aux dépendances transitives (fastify -> ajv, @fastify/ajv-compiler,
# fast-json-stringify) tant que leurs versions ne les exigent pas d'elles-mêmes.
overrides:
  fast-uri@^3: ^3.1.9
  fast-uri@^4: ^4.2.3
