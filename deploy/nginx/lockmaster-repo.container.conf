# FICHIER GÉNÉRÉ par packaging/gen-nginx-container-conf.sh depuis lockmaster-repo.conf : ne pas éditer.
# lockmaster-repo.conf : configuration nginx de référence du serveur de dépôt (ADR-0008).
#
# nginx sert UNIQUEMENT l'arborescence statique publiée par l'application lockmaster.
# Aucun code lockmaster ne tourne ici : ni base, ni clé privée, ni interface d'administration.
#
# Installation : paquet lockmaster-repo (copie dans /etc/nginx/conf.d/) ou conteneur `repo`.
# Variante conteneur (ports 8443/8080, journaux sur stdout) : lockmaster-repo.container.conf,
# GÉNÉRÉE par packaging/gen-nginx-container-conf.sh : ne pas l'éditer à la main (vérifié en CI).
# Testé avec nginx 1.24 (nginx -t + requêtes réelles) ; à retester en CI sur nginx 1.20/1.22.
#
# Adapter : server_name, certificats TLS, chemin racine si différent de /srv/lockmaster-repo,
# adresse syslog de l'application (ou supprimer la ligne access_log syslog).

# Journal JSON pour les statistiques de téléchargement (agrégées par l'application).
log_format lockmaster_json escape=json
  '{"t":"$time_iso8601","ip":"$remote_addr","m":"$request_method","u":"$uri",'
  '"s":$status,"b":$body_bytes_sent,"ua":"$http_user_agent","user":"$remote_user"}';

# Réponse authentifiée (dépôt privé) : « private », jamais stockée par un cache partagé
# (proxy, CDN) qui la resservirait à n'importe qui.
map $remote_user $lockmaster_cache_scope {
  ""      public;
  default private;
}

# Fichiers « pointeurs » qui changent à chaque publication : jamais mis en cache longtemps.
map $uri $lockmaster_cache {
  default                                              "$lockmaster_cache_scope, max-age=31536000, immutable";
  ~/(InRelease|Release|Release\.gpg)$                  "$lockmaster_cache_scope, no-cache";
  ~/dists/[^/]+/.*/Packages(\.gz|\.xz)?$               "$lockmaster_cache_scope, no-cache";
  ~/repodata/repomd\.xml(\.asc)?$                      "$lockmaster_cache_scope, no-cache";
  ~/APKINDEX\.tar\.gz$                                 "$lockmaster_cache_scope, no-cache";
  ~^/keys/                                             "$lockmaster_cache_scope, max-age=3600";
}

server {
  # « http2 » dans listen : accepté de nginx 1.20 (Rocky 9) et 1.22 (Debian 12) jusqu'à 1.26+
  # (Debian 13, Rocky 10, image officielle), où il ne produit qu'un avertissement de dépréciation.
  # « http2 on; » n'existe qu'à partir de 1.25.1 : on garde la forme compatible avec toutes les cibles.
  listen 8443 ssl http2;
  listen [::]:8443 ssl http2;
  server_name repo.example.com;

  ssl_certificate     /etc/nginx/tls/repo.crt;
  ssl_certificate_key /etc/nginx/tls/repo.key;
  ssl_protocols       TLSv1.2 TLSv1.3;

  root /srv/lockmaster-repo/public;

  server_tokens off;
  autoindex off;
  charset off;
  # Types MIME explicites par extension (remplacent mime.types, qui associe .apk à Android).
  # default_type n'accepte pas de variable : table « types » statique.
  types {
    application/vnd.debian.binary-package deb;
    application/x-rpm                     rpm;
    application/gzip                      gz;
    application/x-xz                      xz;
    application/zstd                      zst;
    application/xml                       xml;
    application/pgp-signature             asc;
  }
  # Sans extension (InRelease, Release, Packages, RPM-GPG-KEY-lockmaster, *.rsa.pub) ; .apk compris.
  default_type application/octet-stream;
  # Sans « always » : jamais d'en-tête de cache sur les réponses d'erreur (un 404 mis en cache
  # « immutable » masquerait un paquet publié ensuite).
  add_header Cache-Control          $lockmaster_cache;
  add_header X-Content-Type-Options nosniff always;
  add_header Strict-Transport-Security "max-age=31536000" always;

  # Les liens symboliques (dists/<suite>, repodata, snapshots) doivent appartenir au même
  # propriétaire que leur cible (testé : un lien vers un fichier de root est refusé, 403).
  # Cela n'empêche PAS un lien vers un fichier du compte publieur situé hors racine : la vraie
  # barrière est que nginx ne peut lire que le groupe lockmaster-repo (jamais /var/lib/lockmaster, 0750
  # lockmaster:lockmaster) et que l'application ne crée que des liens relatifs internes, contrôlés par
  # `lockmaster targets check` (docs/02 §3.8).
  disable_symlinks if_not_owner from=$document_root;

  access_log /dev/stdout lockmaster_json;
  # Statistiques (facultatif) : envoi en syslog UDP vers l'application (stats.syslog_listen).
  # Décommenter et indiquer l'adresse de l'application. Le nom doit se résoudre au démarrage de
  # nginx, sinon nginx refuse de démarrer : préférer une adresse IP.
  # access_log syslog:server=10.0.0.5:5514,facility=local7,tag=lockmaster_repo,severity=info lockmaster_json;

  # Lecture seule.
  if ($request_method !~ ^(GET|HEAD)$) { return 405; }

  # Rien de caché n'est servi (.lockmaster-target.json, fichiers temporaires .tmp-*).
  location ~ /\. { return 404; }

  # Clés publiques : toujours accessibles (nécessaires avant de configurer le client).
  location /keys/ { }

  # Dépôts : authentification EXIGÉE par défaut. Un dépôt n'est public que si l'application a
  # publié le marqueur private/public-repos/<repo>. Si le fichier htpasswd manque pour un dépôt
  # privé, nginx échoue à l'ouvrir et refuse l'accès (fail closed).
  # Regex entre guillemets : obligatoire dès qu'elle contient des accolades.
  location ~ "^/(apt|rpm|apk|snapshots)/(?<lockmaster_repo>[a-z0-9][a-z0-9.-]{0,63})/" {
    set $lockmaster_realm "lockmaster $lockmaster_repo";
    if (-f /srv/lockmaster-repo/private/public-repos/$lockmaster_repo) { set $lockmaster_realm off; }
    auth_basic           $lockmaster_realm;
    auth_basic_user_file /srv/lockmaster-repo/private/htpasswd/$lockmaster_repo.htpasswd;
  }

  # Tout le reste : 404.
  location / { return 404; }
}

# Redirection HTTP -> HTTPS. Les clients apt/dnf/apk suivent la redirection, mais configurer
# directement l'URL https dans les instructions client (c'est ce que fait l'application).
server {
  listen 8080;
  listen [::]:8080;
  server_name repo.example.com;
  server_tokens off;
  return 301 https://$host$request_uri;
}
