# Publication de l'image sur ghcr.io/tiotbenjy/lockmaster, à chaque tag de version vX.Y.Z posé sur un
# commit de main. Environnement « release » protégé, avec relecteur obligatoire
# (docs/guide/securite-github.md) : seul ce job peut écrire dans le registre (SEC-24). L'image publiée
# est celle que ce job a construite puis testée (tests et procédure compose). Signature cosign et
# SBOM : jalon M10.
name: Publication

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

env:
  NODE_VERSION: 24.22.1

jobs:
  image:
    name: Image sur ghcr.io
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: release
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Tag de version exacte, sur un commit de main, égal à package.json
        env:
          TAG: ${{ github.ref_name }}
        run: |
          printf '%s\n' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          test "$TAG" = "v$(node -p "require('./package.json').version")"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      # Mêmes gardes que la CI : une PR fusionnée malgré une CI rouge ne passe pas ici.
      - name: Gardes (motifs, tests de sécurité, contrats, licences, vulnérabilités)
        run: |
          node scripts/check-forbidden.mjs
          node scripts/check-test-guards.mjs --base="$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || git rev-list --max-parents=0 HEAD)"
          node scripts/check-contracts.mjs
          node scripts/check-licenses.mjs
          pnpm audit --audit-level moderate
      - run: pnpm test
      - run: pnpm image
      - name: Image testée avant publication (procédure compose)
        run: |
          systemctl --user start podman.socket
          sh test/deliverables/image.sh podman
      - name: Publication (version, et version majeure si c'est la plus récente)
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
          TAG: ${{ github.ref_name }}
        run: |
          version=$(node -p "require('./package.json').version")
          major=${version%%.*}
          image=ghcr.io/tiotbenjy/lockmaster
          printf '%s' "$TOKEN" | podman login ghcr.io --username "$ACTOR" --password-stdin
          podman push "$image:$version"
          # Le tag majeur (image par défaut de compose) ne recule jamais vers une version plus ancienne.
          latest=$(git tag -l "v$major.*" | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
          if [ "$latest" = "$TAG" ]; then
            podman tag "$image:$version" "$image:$major"
            podman push "$image:$major"
          fi
