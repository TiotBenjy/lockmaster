# Publication de l'image sur ghcr.io/tiotbenjy/lockmaster, à chaque tag de version (vX.Y.Z).
# Environnement « release » protégé, avec relecteurs obligatoires (docs/guide/securite-github.md) :
# seul ce job a le droit d'écrire dans le registre (SEC-24). Signature cosign et SBOM : jalon M10.
name: Publication

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

env:
  NODE_VERSION: 24.22.1

jobs:
  image:
    name: Image sur ghcr.io
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: release
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Le tag correspond à la version de package.json
        env:
          TAG: ${{ github.ref_name }}
        run: test "$TAG" = "v$(node -p "require('./package.json').version")"
      - run: pnpm image
      - name: Publication (version et version majeure)
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          version=$(node -p "require('./package.json').version")
          image=ghcr.io/tiotbenjy/lockmaster
          printf '%s' "$TOKEN" | podman login ghcr.io --username "$ACTOR" --password-stdin
          podman tag "$image:$version" "$image:${version%%.*}"
          podman push "$image:$version"
          podman push "$image:${version%%.*}"
