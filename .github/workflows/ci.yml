# CI de lockmaster : vérifications, tests, construction des trois livrables et tests de livrables
# (critères de sortie de M0, docs/09). Les tests de livrables sont les scripts de test/deliverables/,
# les mêmes qu'en local.
# Sécurité (SEC-24) : actions épinglées par SHA de commit (version en commentaire, mises à jour par
# Dependabot), permissions en lecture seule, aucun secret, aucun cache partagé, et seul le
# déclencheur pull_request (sans droits) pour les PR.
name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Même version que le Node embarqué (packaging/versions.env).
  NODE_VERSION: 24.22.1

jobs:
  check:
    name: Vérifications et tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: pnpm (version et empreinte de packageManager)
        run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Motifs et caractères interdits
        run: node scripts/check-forbidden.mjs
      - name: Garde-fous des tests (SEC-19)
        env:
          BASE_REF: ${{ github.base_ref }}
        run: node scripts/check-test-guards.mjs ${BASE_REF:+--base=origin/$BASE_REF}
      - name: Suites de conformité des interfaces
        run: node scripts/check-contracts.mjs
      - name: Licences de l'arbre de production
        run: node scripts/check-licenses.mjs
      - name: Dépendances vulnérables
        run: pnpm audit --audit-level moderate
      - run: pnpm test
      - run: pnpm test:fuzz

  config:
    name: Configurations de déploiement
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configuration nginx du conteneur régénérée à l'identique
        run: |
          sh packaging/gen-nginx-container-conf.sh
          git diff --exit-code deploy/nginx/
      - name: Quadlets (quadlet -dryrun)
        run: |
          for dir in deploy/quadlet/lockmaster deploy/quadlet/lockmaster-signer; do
            QUADLET_UNIT_DIRS="$PWD/$dir" /usr/libexec/podman/quadlet -dryrun -user >/dev/null
          done
      - name: compose (compose config)
        run: docker compose -f deploy/compose.yaml config -q

  build:
    name: Paquets et image
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Paquets .deb et .rpm (better-sqlite3 compilé depuis les sources)
        run: pnpm package
      - name: Image OCI
        run: |
          pnpm image
          version=$(node -p "require('./package.json').version")
          podman save -o out/image.tar "ghcr.io/tiotbenjy/lockmaster:$version"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: livrables
          path: |
            out/*.deb
            out/*.rpm
            out/image.tar
          retention-days: 7
          if-no-files-found: error

  packages:
    name: Livrable ${{ matrix.test }} (${{ matrix.distro }})
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        distro: [DEBIAN_12, DEBIAN_13, ROCKY_9, ROCKY_10]
        test: [packages, repo-package]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: livrables
          path: out
      - name: Test d'installation
        env:
          TEST: ${{ matrix.test }}
          DISTRO: ${{ matrix.distro }}
        run: sh "test/deliverables/$TEST.sh" "$DISTRO"

  image:
    name: Livrable image (${{ matrix.engine }})
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        engine: [podman, docker]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: livrables
          path: out
      - name: Image chargée dans podman (docker la reçoit du script)
        run: podman load -q -i out/image.tar
      - name: API podman pour `podman compose`
        if: matrix.engine == 'podman'
        run: systemctl --user start podman.socket
      - name: Test compose
        env:
          ENGINE: ${{ matrix.engine }}
        run: sh test/deliverables/image.sh "$ENGINE"
