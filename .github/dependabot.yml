# Mises à jour automatiques proposées en PR (jamais fusionnées sans revue ni CI verte).
# « cooldown » aligne Dependabot sur minimumReleaseAge de pnpm : une version trop récente n'est pas proposée.
# « target-branch: dev » : les mises à jour passent par la branche d'intégration, main ne porte que
# les versions publiées (les mises à jour de sécurité visent toujours la branche par défaut).
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "weekly"
      day: "monday"
      timezone: "Europe/Paris"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    ignore:
      # @types/node suit la version majeure du runtime embarqué (Node 24, ADR-0001).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # TypeScript 7 (compilateur natif) n'est pas lu par dependency-cruiser : les règles de couches
      # passeraient sans rien analyser. À lever quand dependency-cruiser le prendra en charge.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    labels: ["dependencies"]
    commit-message:
      prefix: "build(deps)"
    groups:
      dev:
        dependency-type: "development"
        update-types: ["minor", "patch"]
      prod-correctifs:
        dependency-type: "production"
        update-types: ["patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "weekly"
      day: "monday"
      timezone: "Europe/Paris"
    cooldown:
      default-days: 7
    labels: ["dependencies", "ci"]
    commit-message:
      prefix: "ci(deps)"
    groups:
      # init et analyze doivent avoir la même version, sinon l'analyse CodeQL échoue.
      codeql-action:
        patterns:
          - "github/codeql-action*"

  - package-ecosystem: "docker"
    directory: "/packaging"
    target-branch: "dev"
    schedule:
      interval: "weekly"
      day: "monday"
      timezone: "Europe/Paris"
    cooldown:
      default-days: 7
    labels: ["dependencies", "delivery"]
    commit-message:
      prefix: "build(image)"
